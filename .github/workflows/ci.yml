name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install · typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postinstall runs `prisma generate` (scripts/prisma.mjs) — verify it ran.
      - name: Prisma client generated
        run: test -f src/generated/prisma/client.ts && echo "Prisma client present"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Includes tests/persistence.test.ts — boots an embedded PostgreSQL
      # server distributed through the npm package and runs the migration.
      - name: Unit & integration tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      DATABASE_URL: postgresql://postgres:blackbox@127.0.0.1:5432/blackbox?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: blackbox
          POSTGRES_DB: blackbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
